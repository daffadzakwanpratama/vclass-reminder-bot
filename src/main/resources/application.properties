# ============================================================
#  Application Properties — VClass Reminder Bot
#  All sensitive values are injected from .env via System properties
# ============================================================

spring.application.name=vclass-reminder-bot

# --- Web Server Port (for Render / Cloud health check) ---
server.port=${PORT:8080}

# --- SQLite Database ---
spring.datasource.url=jdbc:sqlite:./reminder.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- VClass / Moodle ---
vclass.url=${VCLASS_URL}
vclass.username=${VCLASS_USERNAME}
vclass.password=${VCLASS_PASSWORD}
vclass.service=${VCLASS_SERVICE:moodle_mobile_app}

# --- Telegram ---
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}

# --- Logging ---
logging.level.root=INFO
logging.level.com.bot.reminder=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20} - %msg%n
